<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>JARVIS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js");}</script>
<style>
:root{--bg:#05070b;--card:#0c1220;--azul:#00e5ff;--txt:#e6f7ff;--mut:#7fa6b5;--user:#12324a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid #123a48}
header h1{font-size:17px;margin:0;letter-spacing:2px;color:var(--azul);flex:1}
.ic{background:transparent;border:1px solid #1d4a5c;color:var(--azul);border-radius:50%;width:38px;height:38px;font-size:17px}
#chat{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:14px;line-height:1.45;word-wrap:break-word}
.msg.user{align-self:flex-end;background:var(--user);white-space:pre-wrap}
.msg.jarvis{align-self:flex-start;background:var(--card);border:1px solid #113a48}
.msg img{max-width:100%;border-radius:10px;display:block}
.vazio{margin:auto;color:var(--mut);text-align:center;font-size:14px;line-height:1.6;padding:20px}
footer{display:flex;gap:8px;padding:10px;border-top:1px solid #123a48;align-items:flex-end;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
textarea{flex:1;resize:none;max-height:140px;min-height:44px;background:var(--card);border:1px solid #1d4a5c;color:var(--txt);border-radius:12px;padding:11px;font:inherit}
#enviar{background:var(--azul);color:#001;border:0;border-radius:12px;padding:0 16px;height:44px;font-weight:600;font:inherit}
#enviar:disabled{opacity:.4}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px}
.modal[hidden]{display:none}
.caixa{background:var(--card);border:1px solid #1d4a5c;border-radius:16px;padding:20px;width:min(94vw,400px);display:flex;flex-direction:column;gap:12px}
.caixa h2{margin:0;color:var(--azul);font-size:18px}
.caixa label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--mut)}
.caixa label.linha{flex-direction:row;align-items:center;gap:8px}
.caixa input[type=password],.caixa input[type=text]{background:#05070b;border:1px solid #1d4a5c;color:var(--txt);border-radius:10px;padding:10px;font:inherit;color-scheme:dark}
.caixa button{background:var(--azul);color:#001;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600}
.caixa button.sec{background:transparent;color:var(--azul);border:1px solid #1d4a5c}
.aviso{color:var(--mut);font-size:12px;line-height:1.5;margin:0}
.linhaBotoes{display:flex;gap:8px;justify-content:flex-end}
</style>
</head>
<body>
<header><h1>JARVIS</h1><button class="ic" id="btnNova" title="Nova conversa">＋</button><button class="ic" id="btnConf" title="Configurações">⚙</button></header>
<main id="chat"></main>
<footer>
  <button class="ic" id="mic" title="Falar">🎤</button>
  <textarea id="txt" rows="1" placeholder="Pergunte, peça uma imagem ou pesquise…"></textarea>
  <button id="enviar" disabled>Enviar</button>
</footer>

<div id="conf" class="modal" hidden>
  <div class="caixa">
    <h2>Configurações</h2>
    <label>Chave da Groq
      <input id="chave" type="password" autocomplete="off" placeholder="gsk_…">
    </label>
    <label>Modelo
      <input id="modelo" type="text" value="openai/gpt-oss-20b">
    </label>
    <label class="linha"><input id="vozOn" type="checkbox"> Responder em voz</label>
    <p class="aviso">Sua chave fica só neste celular. Você pega a chave gratuitamente em console.groq.com.</p>
    <div class="linhaBotoes"><button class="sec" id="fecharConf">Fechar</button><button id="salvarConf">Salvar</button></div>
  </div>
</div>

<script>
// FUNCOES-INICIO
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function md(t){let h=esc(t);h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');return h.split('\n').map(l=>l.replace(/^\s*[-*] /,'• ')).join('<br>');}
function textoParaVoz(t){return String(t).replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/```[\s\S]*?```/g,' ').replace(/https?:\/\/\S+/g,'').replace(/[*_`#>]+/g,'').replace(/\s+/g,' ').trim().slice(0,1500);}
const RE_IMG=/\b(gera\w*|cria\w*|desenh\w*|faz\w*|faca)\b.{0,40}\b(imagem|imagens|foto|desenho|ilustracao|arte|quadro)\b|^\s*(imagem|foto|desenho) (de|do|da)\b/;
const RE_PESQ=/\b(pesquis\w*|busc\w*|procur\w*|quem e\b|o que e\b|quando foi|onde fica)\b/;
function semAcento(t){return String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function querImagem(t){return RE_IMG.test(semAcento(t));}
function precisaPesquisar(t){return RE_PESQ.test(semAcento(t));}
function urlImagem(p){return 'https://image.pollinations.ai/prompt/'+encodeURIComponent(p)+'?width=768&height=768&nologo=true';}
function extrairDelta(linha){linha=String(linha).trim();if(!linha.startsWith('data:'))return null;const c=linha.slice(5).trim();if(!c||c==='[DONE]')return null;try{const d=JSON.parse(c);return(d.choices&&d.choices[0]&&d.choices[0].delta&&d.choices[0].delta.content)||null;}catch(e){return null;}}
async function pesquisarWiki(termo){
  try{
    const r=await fetch('https://pt.wikipedia.org/w/api.php?action=query&list=search&srlimit=1&format=json&origin=*&srsearch='+encodeURIComponent(termo));
    const j=await r.json(); const t=j.query.search[0]; if(!t)return '';
    const r2=await fetch('https://pt.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=1&explaintext=1&redirects=1&format=json&origin=*&titles='+encodeURIComponent(t.title));
    const j2=await r2.json(); const p=Object.values(j2.query.pages)[0];
    if(!p||!p.extract)return '';
    return 'Wikipédia, '+p.title+': '+p.extract+' (https://pt.wikipedia.org/wiki/'+encodeURIComponent(p.title.replace(/ /g,'_'))+')';
  }catch(e){return '';}
}
// FUNCOES-FIM

const SISTEMA='Você é o J.A.R.V.I.S. no celular: educado, prestativo e direto, e trata o usuário por "senhor". Responda curto e claro. Você só conversa, pesquisa e gera imagens. Não controla computador nem casa. Quando usar informações de pesquisa, cite a fonte. Se não souber, diga.';
const CFG='jarvis_cel_cfg', HIST='jarvis_cel_hist';
const $=id=>document.getElementById(id);
const chat=$('chat'), txt=$('txt'), enviar=$('enviar');
let hist=[], ocupado=false;

function cfgCarregar(){try{return JSON.parse(localStorage.getItem(CFG))||{};}catch(e){return {};}}
function cfgSalvar(c){localStorage.setItem(CFG,JSON.stringify(c));}
function salvarHist(){localStorage.setItem(HIST,JSON.stringify(hist.slice(-20)));}
function carregarHist(){try{return JSON.parse(localStorage.getItem(HIST))||[];}catch(e){return [];}}

function novaBolha(quem){const b=document.createElement('div');b.className='msg '+quem;chat.appendChild(b);rolar();return b;}
function rolar(){chat.scrollTop=chat.scrollHeight;}
function mostrarVazio(){chat.innerHTML='';if(hist.length===0){const v=document.createElement('div');v.className='vazio';v.textContent='Olá, senhor. Pergunte algo, peça uma imagem ou pesquise. Para começar, toque em ⚙ e cole sua chave da Groq.';chat.appendChild(v);}}
function atualizarBotao(){enviar.disabled=ocupado||txt.value.trim()==='';}
function renderHist(){chat.innerHTML='';for(const m of hist){const b=novaBolha(m.role==='user'?'user':'jarvis');if(m.role==='user')b.textContent=m.content;else b.innerHTML=md(m.content);}mostrarVazio();}

async function* streamGroq(msgs){
  const cfg=cfgCarregar();
  if(!cfg.chave)throw new Error('Coloque sua chave da Groq nas configurações (⚙).');
  const r=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+cfg.chave,'Content-Type':'application/json'},body:JSON.stringify({model:cfg.modelo||'openai/gpt-oss-20b',messages:msgs,stream:true,temperature:0.5,max_completion_tokens:900})});
  if(!r.ok)throw new Error(r.status===401?'Chave da Groq inválida. Confira nas configurações.':'A Groq respondeu com erro '+r.status+'. Tente de novo.');
  const leitor=r.body.getReader(); const dec=new TextDecoder(); let buf='';
  while(true){
    const {done,value}=await leitor.read(); if(done)break;
    buf+=dec.decode(value,{stream:true}); let i;
    while((i=buf.indexOf('\n'))>=0){const linha=buf.slice(0,i);buf=buf.slice(i+1);const p=extrairDelta(linha);if(p)yield p;}
  }
}

function falar(t){
  if(!cfgCarregar().vozOn||!('speechSynthesis' in window))return;
  const u=new SpeechSynthesisUtterance(textoParaVoz(t)); u.lang='pt-BR';
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

async function enviarMsg(){
  const t=txt.value.trim(); if(!t||ocupado)return;
  if(hist.length===0)chat.innerHTML='';
  novaBolha('user').textContent=t;
  txt.value=''; txt.style.height=''; ocupado=true; atualizarBotao();
  hist.push({role:'user',content:t}); hist=hist.slice(-20); salvarHist();
  try{
    if(querImagem(t)){
      const b=novaBolha('jarvis'); b.textContent='Gerando a imagem…';
      const img=new Image();
      img.onload=()=>{b.textContent='';b.appendChild(img);rolar();};
      img.onerror=()=>{b.textContent='Não consegui gerar a imagem agora. Tente de novo em instantes.';};
      img.alt=t; img.src=urlImagem(t);
      const resp='Aqui está a imagem, senhor.';
      hist.push({role:'assistant',content:resp}); salvarHist(); falar(resp);
    } else {
      let sistema=SISTEMA;
      if(precisaPesquisar(t)){const ctx=await pesquisarWiki(t); sistema+=ctx?'\n\nResultado da pesquisa (cite a fonte): '+ctx:'\n\nA pesquisa não trouxe resultado agora; diga isso se for preciso.';}
      const b=novaBolha('jarvis'); let acc='';
      for await(const p of streamGroq([{role:'system',content:sistema}].concat(hist))){acc+=p;b.innerHTML=md(acc);rolar();}
      acc=acc.trim();
      if(acc){hist.push({role:'assistant',content:acc});salvarHist();falar(acc);}
    }
  }catch(e){
    novaBolha('jarvis').textContent=e.message||'Algo deu errado. Tente de novo.';
  }
  ocupado=false; atualizarBotao();
}

$('btnNova').onclick=()=>{hist=[];salvarHist();mostrarVazio();chat.innerHTML='';mostrarVazio();};
enviar.onclick=enviarMsg;
txt.addEventListener('input',()=>{txt.style.height='auto';txt.style.height=Math.min(txt.scrollHeight,140)+'px';atualizarBotao();});
txt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviarMsg();}});

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){const rec=new SR();rec.lang='pt-BR';rec.interimResults=false;rec.onresult=e=>{txt.value=(txt.value+' '+e.results[0][0].transcript).trim();txt.dispatchEvent(new Event('input'));};$('mic').onclick=()=>{try{rec.start();}catch(e){}};}
else{$('mic').hidden=true;}

$('btnConf').onclick=()=>{const c=cfgCarregar();$('chave').value=c.chave||'';$('modelo').value=c.modelo||'openai/gpt-oss-20b';$('vozOn').checked=!!c.vozOn;$('conf').hidden=false;};
$('fecharConf').onclick=()=>{$('conf').hidden=true;};
$('salvarConf').onclick=()=>{cfgSalvar({chave:$('chave').value.trim(),modelo:$('modelo').value.trim()||'openai/gpt-oss-20b',vozOn:$('vozOn').checked});$('conf').hidden=true;};

hist=carregarHist();
renderHist();
atualizarBotao();
</script>
</body>
</html>
